# Included in every location block: nginx drops the server's add_header lines
# as soon as a location has its own add_header, so they can't just sit at the top.

# Only load scripts, styles, fonts and images from Stempel itself. Possible because
# the fonts are bundled (no Google Fonts) and nothing else comes from outside.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
