# nginx serves the built React app and forwards /api to the backend container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off; # don't reveal the nginx version
    access_log off;    # no log of who uploaded what (IP addresses); errors are still logged

    # Slightly above the backend's 10 MB limit, so the backend answers with its
    # German error message instead of nginx with an HTML page.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # "backend" is the service name in docker-compose.yml.
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Built files have a hash in their name (index-BJVKJBkj.js), so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Everything else is the single page app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
