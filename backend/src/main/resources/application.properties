spring.application.name=stempel

# Uploads: e-invoices are small, so 10 MB is plenty and keeps memory use low.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# The validator logs every rule result (as INFO and even ERROR). Those are results
# for the user, not problems of our app, so we keep them out of the log.
logging.level.org.mustangproject.validator=WARN
logging.level.org.mustangproject.validator.ZUGFeRDValidator=OFF
logging.level.com.helger=WARN
# Style warnings about the official XRechnung XSLT files, printed once when they are compiled. Harmless.
logging.level.com.helger.xml.transform.LoggingTransformErrorListener=ERROR
