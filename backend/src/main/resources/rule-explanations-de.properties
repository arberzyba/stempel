# Plain German explanations for the most common EN 16931 and XRechnung rules.
# Format per rule:  <RULE-ID>.title, <RULE-ID>.text and optionally <RULE-ID>.area
# area = where the problem is shown in the invoice: seller, buyer, lines, totals, payment
# This file is read as UTF-8 (see RuleExplanations.java).
# Rules not listed here fall back to the official rule text.

# --- EN 16931: required fields ---------------------------------------------

BR-01.title=Die Kennung des Standards fehlt
BR-01.text=Die Rechnung gibt nicht an, nach welchem Standard sie erstellt wurde (z. B. XRechnung oder ZUGFeRD). Das erstellende Programm muss diese Angabe automatisch setzen.

BR-02.title=Die Rechnungsnummer fehlt
BR-02.text=Jede Rechnung braucht eine eindeutige Rechnungsnummer.

BR-03.title=Das Rechnungsdatum fehlt
BR-03.text=Jede Rechnung braucht ein Rechnungsdatum.

BR-04.title=Die Art des Dokuments fehlt
BR-04.text=Die Rechnung gibt nicht an, ob sie eine Rechnung, Gutschrift oder Korrektur ist (Rechnungsartcode).

BR-05.title=Die Währung fehlt
BR-05.text=Die Rechnung gibt nicht an, in welcher Währung die Beträge stehen (z. B. EUR).

BR-06.title=Der Name des Verkäufers fehlt
BR-06.text=Der Absender der Rechnung muss mit seinem Namen angegeben sein.
BR-06.area=seller

BR-07.title=Der Name des Käufers fehlt
BR-07.text=Der Empfänger der Rechnung muss mit seinem Namen angegeben sein.
BR-07.area=buyer

BR-08.title=Die Anschrift des Verkäufers fehlt
BR-08.text=Die Postanschrift des Absenders muss angegeben sein.
BR-08.area=seller

BR-09.title=Das Land des Verkäufers fehlt
BR-09.text=In der Anschrift des Absenders fehlt der Ländercode (z. B. DE).
BR-09.area=seller

BR-10.title=Die Anschrift des Käufers fehlt
BR-10.text=Die Postanschrift des Empfängers muss angegeben sein.
BR-10.area=buyer

BR-11.title=Das Land des Käufers fehlt
BR-11.text=In der Anschrift des Empfängers fehlt der Ländercode (z. B. DE).
BR-11.area=buyer

BR-12.title=Die Summe der Positionen fehlt
BR-12.text=Die Rechnung muss die Summe aller Positionen (netto) angeben.
BR-12.area=totals

BR-13.title=Der Gesamtbetrag ohne Umsatzsteuer fehlt
BR-13.text=Die Rechnung muss den Gesamtbetrag netto angeben.
BR-13.area=totals

BR-14.title=Der Gesamtbetrag mit Umsatzsteuer fehlt
BR-14.text=Die Rechnung muss den Gesamtbetrag brutto angeben.
BR-14.area=totals

BR-15.title=Der zu zahlende Betrag fehlt
BR-15.text=Die Rechnung muss angeben, welcher Betrag zu zahlen ist.
BR-15.area=totals

BR-16.title=Die Rechnung hat keine Positionen
BR-16.text=Eine Rechnung muss mindestens eine Rechnungsposition enthalten.
BR-16.area=lines

# --- EN 16931: calculations ------------------------------------------------

BR-CO-10.title=Die Summe der Positionen stimmt nicht
BR-CO-10.text=Die angegebene Summe der Positionen entspricht nicht der Summe der einzelnen Nettobeträge. Vermutlich ein Rechenfehler beim Absender.
BR-CO-10.area=totals

BR-CO-13.title=Der Nettobetrag stimmt nicht
BR-CO-13.text=Der Gesamtbetrag ohne Umsatzsteuer muss der Summe der Positionen abzüglich Nachlässen und zuzüglich Zuschlägen entsprechen.
BR-CO-13.area=totals

BR-CO-14.title=Die Umsatzsteuer stimmt nicht
BR-CO-14.text=Die gesamte Umsatzsteuer muss der Summe der Steuerbeträge der einzelnen Steuersätze entsprechen.
BR-CO-14.area=totals

BR-CO-15.title=Der Gesamtbetrag stimmt nicht
BR-CO-15.text=Netto plus Umsatzsteuer ergibt nicht den angegebenen Gesamtbetrag. Vermutlich ein Rechen- oder Tippfehler beim Absender.
BR-CO-15.area=totals

BR-CO-16.title=Der zu zahlende Betrag stimmt nicht
BR-CO-16.text=Der zu zahlende Betrag muss dem Gesamtbetrag abzüglich bereits gezahlter Beträge entsprechen.
BR-CO-16.area=totals

BR-CO-25.title=Fälligkeit oder Zahlungsbedingungen fehlen
BR-CO-25.text=Wenn ein Betrag zu zahlen ist, muss die Rechnung ein Fälligkeitsdatum oder Zahlungsbedingungen angeben.
BR-CO-25.area=payment

# --- XRechnung (German rules) ----------------------------------------------

BR-DE-1.title=Die Zahlungsangaben fehlen
BR-DE-1.text=Eine XRechnung muss angeben, wie bezahlt werden soll, zum Beispiel per Überweisung mit IBAN.
BR-DE-1.area=payment

BR-DE-2.title=Der Ansprechpartner des Verkäufers fehlt
BR-DE-2.text=Eine XRechnung muss einen Ansprechpartner beim Absender nennen.
BR-DE-2.area=seller

BR-DE-3.title=Der Ort des Verkäufers fehlt
BR-DE-3.text=In der Anschrift des Absenders fehlt der Ort.
BR-DE-3.area=seller

BR-DE-4.title=Die Postleitzahl des Verkäufers fehlt
BR-DE-4.text=In der Anschrift des Absenders fehlt die Postleitzahl.
BR-DE-4.area=seller

BR-DE-5.title=Der Name des Ansprechpartners fehlt
BR-DE-5.text=Beim Ansprechpartner des Absenders muss ein Name oder eine Abteilung angegeben sein.
BR-DE-5.area=seller

BR-DE-6.title=Die Telefonnummer des Ansprechpartners fehlt
BR-DE-6.text=Beim Ansprechpartner des Absenders muss eine Telefonnummer angegeben sein.
BR-DE-6.area=seller

BR-DE-7.title=Die E-Mail-Adresse des Ansprechpartners fehlt
BR-DE-7.text=Beim Ansprechpartner des Absenders muss eine E-Mail-Adresse angegeben sein.
BR-DE-7.area=seller

BR-DE-8.title=Der Ort des Käufers fehlt
BR-DE-8.text=In der Anschrift des Empfängers fehlt der Ort.
BR-DE-8.area=buyer

BR-DE-9.title=Die Postleitzahl des Käufers fehlt
BR-DE-9.text=In der Anschrift des Empfängers fehlt die Postleitzahl.
BR-DE-9.area=buyer

BR-DE-15.title=Die Käuferreferenz fehlt
BR-DE-15.text=Eine XRechnung muss die Käuferreferenz enthalten, zum Beispiel die Leitweg-ID einer Behörde oder eine Bestellnummer. Ohne sie kann der Empfänger die Rechnung nicht zuordnen.
BR-DE-15.area=buyer

BR-DE-21.title=Die Rechnung ist nicht als XRechnung gekennzeichnet
BR-DE-21.text=Die Kennung des Standards entspricht nicht der XRechnung. Für Rechnungen, die keine XRechnung sein müssen (z. B. ZUGFeRD), ist das kein Problem.

BR-DE-TMP-32.title=Das Liefer- oder Leistungsdatum fehlt
BR-DE-TMP-32.text=Die Rechnung sollte angeben, wann geliefert oder geleistet wurde: als Lieferdatum, als Abrechnungszeitraum oder bei jeder Position. Nach dem Umsatzsteuergesetz gehört diese Angabe auf jede Rechnung.

# --- Peppol rules (used by XRechnung) --------------------------------------

PEPPOL-EN16931-R001.title=Die Geschäftsprozess-Kennung fehlt
PEPPOL-EN16931-R001.text=Die Rechnung gibt nicht an, zu welchem Geschäftsprozess sie gehört. Das erstellende Programm muss diese Angabe automatisch setzen.

PEPPOL-EN16931-R010.title=Die elektronische Adresse des Käufers fehlt
PEPPOL-EN16931-R010.text=Für eine XRechnung muss der Empfänger eine elektronische Adresse haben, meist eine E-Mail-Adresse oder Leitweg-ID.
PEPPOL-EN16931-R010.area=buyer

PEPPOL-EN16931-R020.title=Die elektronische Adresse des Verkäufers fehlt
PEPPOL-EN16931-R020.text=Für eine XRechnung muss der Absender eine elektronische Adresse haben, meist eine E-Mail-Adresse.
PEPPOL-EN16931-R020.area=seller
